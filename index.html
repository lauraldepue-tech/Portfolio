<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura DePue | LXD, EdTech, Narrative & Game Designer</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d80;
            --accent-gold: #f4b400;
            --accent-teal: #008080;
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --bg-main: #ffffff;
            --bg-alt: #f8fafc;
            --card-border: #e2e8f0;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-dark);
            background-color: var(--bg-main);
            line-height: 1.6;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-dark);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
            text-decoration: none;
        }

        /* Container */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Hero */
        .hero {
            padding: 5rem 0 4rem;
            text-align: left;
        }

        .pill-badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.25rem;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
            color: var(--text-dark);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 820px;
            margin-bottom: 2rem;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
            padding: 2rem;
            background-color: var(--bg-alt);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .stat-item h3 {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 800;
        }

        .stat-item p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        /* Section Header */
        .section-title {
            margin: 5rem 0 3rem;
        }

        .section-title h2 {
            font-size: 2.25rem;
            letter-spacing: -0.02em;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-top: 0.5rem;
        }

        /* Case Study Card */
        .project-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 4rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .project-card.reverse {
            direction: rtl;
        }

        .project-card.reverse > * {
            direction: ltr;
        }

        .project-preview {
            background-color: var(--bg-alt);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--card-border);
        }

        .project-card.reverse .project-preview {
            border-right: none;
            border-left: 1px solid var(--card-border);
        }

        .project-body {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .project-body .tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-teal);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .project-body h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .project-body p {
            color: var(--text-muted);
            font-size: 0.98rem;
            margin-bottom: 1.25rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .skill-pill {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
        }

        /* Mockup Components */
        .mockup
